# Optional one-command run: docker compose up --build  →  http://localhost:5173
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["8000:8000"]
  web:
    build: ./frontend
    environment:
      API_URL: http://api:8000
    ports: ["5173:5173"]
    depends_on: [api]
