[project]
name = "atc"
version = "0.1.0"
description = "Alert Traffic Controller: a member-first alert gateway for a retail bank"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faker>=40.54.0",
    "fastapi>=0.164.0",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.50",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atc"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["atc"]
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["atc.engine", "atc.engine.*", "atc.directory", "atc.directory.*", "atc.config"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Starlette recommends httpx2 for TestClient; httpx still works and is pinned for now.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["atc"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
